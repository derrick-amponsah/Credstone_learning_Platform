<!-- @dsCard group="Learning" height=330 subtitle="Streak and badge stats, earned and locked badges" -->
<meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>html{background:var(--surface)}body{margin:0;padding:24px;background:var(--surface)}</style>
<div class="cs-root" style="display:flex;flex-direction:column;gap:20px">
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px">
    <div class="cs-stat"><svg aria-hidden="true" width="40" height="40" viewBox="0 0 24 24" fill="var(--gold)" stroke="var(--gold-ink)" stroke-width="1.4" stroke-linejoin="round"><path d="M12 2c1 4-3 5-3 9a3 3 0 006 0c0-1-.5-2-1-3 3 1 5 4 5 7a7 7 0 01-14 0c0-6 7-7 7-13z"/></svg><div><div class="cs-stat__value">5 days</div><div class="cs-stat__label">learning streak</div></div></div>
    <div class="cs-stat"><svg aria-hidden="true" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="var(--navy)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="6"/><path d="M8.5 14L7 22l5-3 5 3-1.5-8"/></svg><div><div class="cs-stat__value">3 badges</div><div class="cs-stat__label">earned this year</div></div></div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px">
    <div class="cs-badge"><div class="cs-medal"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></div><div class="cs-badge__name">First course</div><div class="cs-small">Completed your first course</div></div>
    <div class="cs-badge cs-badge--locked"><div class="cs-medal cs-medal--locked"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg></div><div class="cs-badge__name">Ten-day streak</div><div class="cs-small">5 more days to unlock</div></div>
  </div>
</div>
