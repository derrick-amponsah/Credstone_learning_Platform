<meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=Source+Code+Pro:wght@400;600;700&display=swap">
<style>html{background:var(--surface)}body{margin:0;padding:24px;background:var(--surface)}</style>
<div class="cs-root" style="display:grid;gap:12px;max-width:620px">
<div class="cs-alert cs-alert--info" role="status"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 11v6M12 7.5h.01"/></svg><div><span class="cs-alert__title">Good to know.</span> Your lab environment resets after 2 hours.</div></div>
<div class="cs-alert cs-alert--warning" role="alert"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/></svg><div><span class="cs-alert__title">Due soon.</span> Information Security Basics is due on 31 Oct.</div></div>
<div class="cs-alert cs-alert--error" role="alert"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9 9l6 6M15 9l-6 6"/></svg><div><span class="cs-alert__title">Problem.</span> Your code did not compile. Check line 12.</div></div>
<div class="cs-alert cs-alert--success" role="status"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12.5l3 3 5-6"/></svg><div><span class="cs-alert__title">Saved.</span> Your progress is up to date.</div></div></div>
