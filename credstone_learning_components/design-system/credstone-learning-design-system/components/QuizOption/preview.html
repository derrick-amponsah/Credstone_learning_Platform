<!-- @dsCard group="Learning" height=400 subtitle="Radio answer options, unselected and selected" -->
<meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>html{background:var(--surface)}body{margin:0;padding:24px;background:var(--surface)}</style>
<form class="cs-root" style="max-width:640px">
  <fieldset style="border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:12px">
    <legend class="cs-title" style="margin-bottom:16px;font-size:26px;line-height:34px">A colleague's report contains several errors. What is the best first step?</legend>
    <label class="cs-option"><input type="radio" name="q"><span>Correct the errors yourself without telling them.</span></label>
    <label class="cs-option cs-option--selected"><input type="radio" name="q" checked><span>Share specific examples privately and ask how you can help.</span></label>
    <label class="cs-option"><input type="radio" name="q"><span>Mention the errors during the next team meeting.</span></label>
    <label class="cs-option"><input type="radio" name="q"><span>Wait until their annual review.</span></label>
  </fieldset>
</form>
