# Standalone MinIO Compose Configuration for Credstone Learning
# Run with: docker compose -f docker-compose.minio.yml up -d

services:
  minio:
    image: ghcr.io/coollabsio/minio:latest
    container_name: credstone-minio
    restart: unless-stopped
    ports:
      - "9000:9000"    # S3 API endpoint
      - "9001:9001"    # Web Console UI
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "/usr/bin/mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Automatically bootstraps the required bucket on startup
  createbuckets:
    image: ghcr.io/coollabsio/minio:latest
    container_name: credstone-minio-createbuckets
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set localminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb localminio/credstone-uploads 2>/dev/null || true;
      /usr/bin/mc anonymous set download localminio/credstone-uploads 2>/dev/null || true;
      echo '✅ Bucket credstone-uploads ready.';
      exit 0;
      "

volumes:
  minio_data:
