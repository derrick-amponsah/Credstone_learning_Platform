services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: credstone, POSTGRES_PASSWORD: credstone, POSTGRES_DB: credstone }
    ports: ["5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U credstone"], interval: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgres://credstone:credstone@db:5432/credstone
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-me-to-a-long-random-string
      APP_URL: http://localhost:3000
      CORS_ORIGIN: http://localhost:3000
      UPLOAD_DIR: /data/uploads
    volumes: [uploads:/data/uploads]
    ports: ["4000:4000"]
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }
  web:
    build: { context: ./frontend, args: { BACKEND_URL: "http://api:4000" } }
    ports: ["3000:3000"]
    depends_on: [api]
volumes: { dbdata: {}, uploads: {} }
